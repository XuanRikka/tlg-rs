name: Release

# 触发：推送 vX.Y.Z tag；也可手动 workflow_dispatch（手动只构建，不发布）
#
# publish：把 tlg-rs、tlg-rs-cli 依次发布到 crates.io
# build  ：按矩阵构建工作区里的全部可执行文件
# release：把可执行文件打包为 <主包包名>-<target>.tar.gz/.zip 挂到 GitHub Release
#          Release 里只放可执行文件
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 统一解析主包名、版本号和全部 bin target，避免其它 job 反复解析 cargo metadata
  meta:
    name: Resolve package metadata
    runs-on: ubuntu-latest
    outputs:
      main_package: ${{ steps.meta.outputs.main_package }}
      version: ${{ steps.meta.outputs.version }}
      bin_names: ${{ steps.meta.outputs.bin_names }}
      bin_list: ${{ steps.meta.outputs.bin_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve main package, version and binaries
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          cargo metadata --no-deps --format-version 1 > metadata.json

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open("metadata.json", encoding="utf-8") as fh:
              metadata = json.load(fh)

          def norm(path):
              return path.replace(chr(92), "/").rstrip("/")

          root = norm(metadata["workspace_root"])
          main = None
          for package in metadata["packages"]:
              if norm(package["manifest_path"]) == root + "/Cargo.toml":
                  main = package
                  break
          if main is None:
              raise SystemExit("could not resolve the workspace root package")

          bins = sorted({target["name"] for package in metadata["packages"] for target in package["targets"] if "bin" in target["kind"]})
          if not bins:
              raise SystemExit("no binary targets found in this workspace")

          version = main["version"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              ref = os.environ.get("GITHUB_REF_NAME", "")
              tag_version = ref[1:] if ref.startswith("v") else ref
              if tag_version != version:
                  raise SystemExit(f"tag {ref} does not match {main['name']} version {version}")

          print(f"main_package={main['name']}")
          print(f"version={version}")
          print(f"bin_names={json.dumps(bins)}")
          print("bin_list<<__BIN_LIST__")
          for binary in bins:
              print(binary)
          print("__BIN_LIST__")
          PY

  # 发布到 crates.io，顺序即依赖顺序
  publish:
    name: Publish to crates.io
    needs: meta
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          # 已经发布过的版本直接跳过，重复跑同一个 tag 也能成功
          publish_crate() {
            local package="$1"
            local status attempt

            status="$(curl -s -o /dev/null -w '%{http_code}' -A "tlg-rs-release-workflow" "https://crates.io/api/v1/crates/${package}/${VERSION}" || true)"
            if [[ "$status" == "200" ]]; then
              echo "::notice::${package} ${VERSION} is already published, skipping"
              return 0
            fi

            echo "::group::Publishing ${package} ${VERSION}"
            for attempt in 1 2 3 4 5 6; do
              if cargo publish -p "$package" --verbose; then
                echo "::endgroup::"
                return 0
              fi
              # 刚发布的依赖可能还没进索引，稍等后重试
              echo "::warning::Attempt ${attempt} to publish ${package} failed; retrying in 30s"
              sleep 30
            done
            echo "::error::Failed to publish ${package} ${VERSION}"
            echo "::endgroup::"
            return 1
          }

          # 依赖顺序：tlg-rs 先于 tlg-rs-cli
          for package in tlg-rs tlg-rs-cli; do
            publish_crate "$package"
          done

  # 矩阵构建全部可执行文件
  build:
    name: Build ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      MAIN_PACKAGE: ${{ needs.meta.outputs.main_package }}
      BIN_NAMES: ${{ needs.meta.outputs.bin_names }}
      BIN_LIST: ${{ needs.meta.outputs.bin_list }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add Rust target
        if: ${{ matrix.cross != true }}
        shell: bash
        run: rustup target add "$TARGET"

      - name: Install cross
        if: ${{ matrix.cross == true }}
        shell: bash
        run: cargo install cross --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --verbose --release --target "$TARGET" --workspace
          else
            cargo build --verbose --release --target "$TARGET" --workspace
          fi

      - name: Package executables (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist
          mkdir -p dist

          while IFS= read -r bin; do
            if [[ -z "$bin" ]]; then
              continue
            fi
            src="target/${TARGET}/release/${bin}"
            if [[ ! -f "$src" ]]; then
              echo "::error::Binary not found: $src"
              exit 1
            fi
            cp "$src" dist/
          done <<< "$BIN_LIST"

          archive="${MAIN_PACKAGE}-${TARGET}.tar.gz"
          tar -czf "$archive" -C dist .
          echo "Created $archive"
          tar -tzf "$archive"

      - name: Package executables (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null

          foreach ($bin in ($env:BIN_NAMES | ConvertFrom-Json)) {
            $src = "target/$env:TARGET/release/$bin.exe"
            if (-not (Test-Path $src)) {
              throw "Binary not found: $src"
            }
            Copy-Item $src -Destination dist/
          }

          $archive = "{0}-{1}.zip" -f $env:MAIN_PACKAGE, $env:TARGET
          Compress-Archive -Path "dist/*" -DestinationPath $archive -Force
          Write-Host "Created $archive"
          Get-ChildItem dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.main_package }}-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ needs.meta.outputs.main_package }}-${{ matrix.target }}.tar.gz
            ${{ needs.meta.outputs.main_package }}-${{ matrix.target }}.zip

  # 把矩阵产物挂到 GitHub Release（只包含可执行文件）
  release:
    name: Publish GitHub Release
    needs: [meta, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List packages
        shell: bash
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
