[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["XuanRikka <xuanrikka@qq.com>"]
repository = "https://github.com/XuanRikka/tlg-rs"

[package]
name = "tlg-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A pure Rust crate for the KrKr2 tlg image format"
keywords = ["image", "tlg", "krkr"]
categories = ["multimedia::encoding", "multimedia::images"]

[lib]
name = "tlg"
crate-type = ["rlib"]

[profile.release]
opt-level = 3

[profile.bench]
debug = "full"

[dependencies]
byteorder = "1.5.0"
image = { version = "0.25.10", default-features = false, optional = true }
slide = { path = "slide" }
anyhow = { workspace = true }

[dev-dependencies]
criterion = "0.8.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[[bench]]
name = "tlg5"
harness = false

[workspace.dependencies]
anyhow = "1.0.104"

[features]
default = ["image"]
image = ["dep:image"]

[workspace]
resolver = "3"
members = [
    "slide",
    "tlg-rs-cli"
]
